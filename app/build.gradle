plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.cartools'
    compileSdk 34

    defaultConfig {
        applicationId "com.leo.cartools"
        minSdk 26
        // 保持 28：车机固件为 Android 9，targetSdk 再抬高会收紧 hidden API 限制。
        // 反射 ServiceManager.getService 在 P 上属 greylist（可用，会打一条日志）；
        // 若将来固件升到 Android 10+，需改用 Parcel / IBinder 别名方案获取该 binder。
        targetSdk 28
        versionCode 25
        versionName "2.5"
    }

    /**
     * 固定签名：仓库内置 keystore，保证每个版本的证书一致，可直接覆盖升级。
     * 早期版本用 CI 临时生成的 debug keystore，导致每个 release 签名都不同。
     * 注意：这是公开仓库里的调试密钥，仅用于此车机工具，不要用于其他项目。
     */
    signingConfigs {
        release {
            storeFile file("../keystore/carhelper.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
