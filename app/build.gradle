plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.cartools'
    compileSdk 34

    defaultConfig {
        applicationId "com.leo.cartools"
        minSdk 26
        // 保持 28：车机固件为 Android 9，targetSdk 再抬高会收紧 hidden API 限制。
        // 反射 ServiceManager.getService 在 P 上属 greylist（可用，会打一条日志）；
        // 若将来固件升到 Android 10+，需改用 Parcel / IBinder 别名方案获取该 binder。
        targetSdk 28
        versionCode 21
        versionName "2.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 用 debug 签名,便于车机直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
