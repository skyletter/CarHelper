name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from build.gradle
        id: ver
        run: |
          V=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$V" ]; then
            echo "::error::versionName not found in app/build.gradle"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building CarHelper v$V"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build release APK（固定签名）
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CarHelper-v${{ steps.ver.outputs.version }}.apk"
          ls -l out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarHelper-v${{ steps.ver.outputs.version }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }} — 车机助手
          files: out/CarHelper-v${{ steps.ver.outputs.version }}.apk
          body: |
            长安 C211 平台车机（全志 T7 / Android 9）三合一工具。

            ## 解决三个问题

            1. **升级高德后，仪表盘「导航信息」页变灰进不去**
               → 导航时自动恢复，仪表显示转向箭头 + 到路口距离
            2. **第三方播放器显示播放中但没声音**（AntennaPod / 喜马拉雅 / QQ 音乐等）
               → 开机自动解锁音源，不用再先开一次酷我
            3. **等红灯、堵车时外循环吸尾气**
               → 停车自动切内循环，跑起来自动切回外循环

            ## 本次更新（v4.0）

            - **修复开机自启缺自动内外循环**：开机广播此前只拉起导航桥接与
              音源解锁两个服务，新加的 ClimateService 漏在链路外——
              导致开机不操作时自动循环不生效，需手动打开 App 后才启动。
              现已加入开机启动链路
            - **root 增强（自用）**：开机时静默授予定位权限（重装/清数据后
              不再弹窗、不再空转），并加入电池优化白名单防止系统回收前台服务

            ## v3.9 更新

            - **精简界面**：移除「切内循环 / 切外循环」手动按钮——
              车辆自带实体按键切换更方便，自动逻辑不受影响

            ## v3.8 更新

            - **修复设置不保存**：输入法回车不触发焦点丢失，导致阈值/确认时长
              从未落盘，重开面板被默认值覆盖。现在回车立即保存，
              且按 Home/切后台时也会兜底保存（onPause）

            ## v3.7 更新

            - **响应提速**：GPS 请求改为最高频率（间隔 0，与高德同源同频，系统聚合调度无冲突）、
              判定周期 1s → 500ms
            - **渐进式确认**：速度越过迟滞边界再超出 5（默认 ≥35 / ≤15）**立即切换**；
              边缘区（30~35 / 15~20）需持续「确认时长」
            - **确认时长支持 0**：面板设为 0 即完全关闭确认窗口（越过边缘即切），
              默认仍为 3 秒，范围 0~10 秒
            - 切换延迟：急加速/急停 **1~2 秒**（原 4~6 秒），缓变 3~4 秒

            ## v3.6 变更

            - **N 档不再让行**：只有 P / R 档暂停自动切换，N 档滑行时照常工作
            - 修复手动按钮方向：v3.4 修复了自动切换路径但遗漏了手动按钮，
              「切内/切外」仍用旧映射，现已与自动切换统一（0=内 1=外）

            ## v3.4 修复

            - **修复循环方向反了**：实测确认车机 `HVAC_RECIRC_ON` 语义与 AAOS 相反
              （0=内循环 1=外循环），自动切换与手动按钮均已纠正
            - **修复定位权限**：服务先于授权启动导致权限状态固化，现在每秒复查，
              授权后自动启动 GPS，无需重启应用

            ## v3.0~v3.3 新增

            - **确认时长可配置**：面板新增「确认时长」输入框（默认 3 秒，限 1~10 秒），
              速度越过迟滞边界后需持续该时长才切换
            - 阈值与确认时长独立调整，互不影响

            ## v3.0~v3.2 新增

            - 新增**自动内外循环**：按 GPS 速度自动切换，面板可开关
            - 阈值默认 25 km/h（迟滞 ±5），可在面板调整 15~50
            - 空调 AUTO / 除霜 / P·R·N 档 / GPS 失效时自动让行，不改变当前状态
            - 控制面板新增「自动内外循环」卡片：开关、阈值输入、实时状态、手动切内/外
            - 新增单元测试，CI 构建前自动运行

            ## 使用方法

            1. 安装下面的 `CarHelper-v${{ steps.ver.outputs.version }}.apk`
            2. 把「车机助手」加入车机**自启动白名单**
            3. 重启车机

            之后无需配置：高德开始导航，方向盘切到「导航信息」页即可；第三方播放器直接有声。

            **自动内外循环需要在控制面板里手动打开开关**（默认关闭），并授予定位权限。

            ## 原理

            - 仪表导航：监听高德 8.x 的 `AUTONAVI_STANDARD_BROADCAST_SEND`(KEY_TYPE=10001)，
              按原厂 `TBT_Navi_id_mapping` 转换转向图标后，补发
              `com.autonavi.navigation.NAVIGATION_UPDATES` 给 `com.fce.navi.service`
            - 音源解锁：调用车机自带 `requestSource("app")`，解除功放静音
            - 自动内外循环：GPS 测速 + 迟滞状态机，调用 `ICarProperty.setProperty` 写 `HVAC_RECIRC_ON`

            不改系统分区、不刷机、不需要 root。

            ## 适用范围

            长安 inCall / Coagent C211 平台车机，版本号以 `OS_C211-` / `OS_CA` 开头。
            仅测试于 `OS_CA6884-V9_V00.00.47-20210517`。

            详见 README。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
