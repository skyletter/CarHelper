name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from build.gradle
        id: ver
        run: |
          V=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$V" ]; then
            echo "::error::versionName not found in app/build.gradle"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building CarHelper v$V"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build release APK（固定签名）
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CarHelper-v${{ steps.ver.outputs.version }}.apk"
          ls -l out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarHelper-v${{ steps.ver.outputs.version }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }} — 导航仪表桥接 + 音源解锁
          files: out/CarHelper-v${{ steps.ver.outputs.version }}.apk
          body: |
            长安 C211 平台车机（全志 T7 / Android 9）二合一工具。

            ## 解决两个问题

            1. **升级高德后，仪表盘「导航信息」页变灰进不去**
               → 导航时自动恢复，仪表显示转向箭头 + 到路口距离
            2. **第三方播放器显示播放中但没声音**（AntennaPod / 喜马拉雅 / QQ 音乐等）
               → 开机自动解锁音源，不用再先开一次酷我

            ## 本次更新（v2.4）

            - 修复「音源解锁」状态误报：改为实时查询车机当前音源
            - 覆盖安装后不再显示错误的「未解锁」
            - `requestSource` 补上 AIDL 的 `force` 参数

            ## 使用方法

            1. 安装下面的 `CarHelper-v${{ steps.ver.outputs.version }}.apk`
            2. 把「车机助手」加入车机**自启动白名单**
            3. 重启车机

            之后无需配置：高德开始导航，方向盘切到「导航信息」页即可；第三方播放器直接有声。

            有控制面板：点图标可查看桥接与解锁状态、手动解锁音源、重启桥接。

            ## 原理

            - 仪表导航：监听高德 8.x 的 `AUTONAVI_STANDARD_BROADCAST_SEND`(KEY_TYPE=10001)，
              按原厂 `TBT_Navi_id_mapping` 转换转向图标后，补发
              `com.autonavi.navigation.NAVIGATION_UPDATES` 给 `com.fce.navi.service`
            - 音源解锁：调用车机自带 `requestSource("app")`，解除功放静音

            不改系统分区、不刷机、不需要 root。

            ## 适用范围

            长安 inCall / Coagent C211 平台车机，版本号以 `OS_C211-` / `OS_CA` 开头。
            仅测试于 `OS_CA6884-V9_V00.00.47-20210517`。

            详见 README。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
