plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leo.cartools'
    compileSdk 34

    defaultConfig {
        applicationId "com.leo.cartools"
        minSdk 26
        targetSdk 28          // 保持 28:Android 9 上反射 ServiceManager 不受 hidden API 限制
        versionCode 20
        versionName "2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 用 debug 签名,便于车机直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
